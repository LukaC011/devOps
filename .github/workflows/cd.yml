name: CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout kod
        uses: actions/checkout@v3

      - name: Logovanje na GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i Push Docker Image-a (Employee Service)
        run: |
          cd backend/employee-service
          IMAGE_ID=ghcr.io/lukac011/employee-service
          # Pretvara sva slova u mala zbog Docker pravila
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          docker build -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest
