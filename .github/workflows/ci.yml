name: CI Pipeline

on:
  push:
    branches: ["main", "feature/*", "fix/*", "chore/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Podesi Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build i test svih servisa
        run: mvn -B -f backend/pom.xml verify

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend/employee-service
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.projectKey=LukaC011_devOps -Dsonar.organization=luxuz123 -Dsonar.host.url=https://sonarcloud.io

      - name: Upload build artefakata
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: backend/*/target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - employee-service
          - client-service
          - task-service
          - notification-service
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Docker build (${{ matrix.service }})
        run: docker build -t ${{ matrix.service }}:test backend/${{ matrix.service }}
