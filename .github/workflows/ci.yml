name: CI Pipeline

on:
  push:
    branches: ["main", "feature/*", "fix/*", "chore/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Podesi Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build i test svih servisa
        run: mvn -B -f backend/pom.xml verify

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B -f backend/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.qualitygate.wait=true

      - name: Upload build artefakata
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: backend/*/target/*.jar
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Podesi Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Priprema okruzenja
        run: cp .env.example .env

      - name: Podizanje sistema
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: E2E testovi
        run: mvn -B -f e2e-tests/pom.xml verify

      - name: Logovi pri padu
        if: failure()
        run: docker compose logs --tail=150

      - name: Gasenje stack-a
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - employee-service
          - client-service
          - task-service
          - notification-service
    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Docker build (${{ matrix.service }})
        run: docker build -t ${{ matrix.service }}:test backend/${{ matrix.service }}
