name: CI Pipeline

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v3

      - name: Podesi Java 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build i Test (Employee Service)
        run: |
          cd backend/employee-service
          mvn clean test package

      - name: SonarCloud Scan (Employee Service)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend/employee-service
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=117d04e20484f744aac67790b965013df0f8e1ad -Dsonar.organization=Luxuz -Dsonar.host.url=https://sonarcloud.io

      - name: Docker Build (Employee Service)
        run: |
          cd backend/employee-service
          docker build -t employee-service:test .
