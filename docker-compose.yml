services:
  postgres:
    image: postgres:15
    container_name: crm_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: crm_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - crm_network

  employee-service:
    build:
      context: ./backend/employee-service
    image: ${IMAGE_REGISTRY}/employee-service:${IMAGE_TAG}
    container_name: crm_employee_service
    environment:
      SERVER_PORT: 8081
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employee_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      zipkin:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - crm_network

  client-service:
    build:
      context: ./backend/client-service
    image: ${IMAGE_REGISTRY}/client-service:${IMAGE_TAG}
    container_name: crm_client_service
    environment:
      SERVER_PORT: 8082
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/client_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      zipkin:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - crm_network

  task-service:
    build:
      context: ./backend/task-service
    image: ${IMAGE_REGISTRY}/task-service:${IMAGE_TAG}
    container_name: crm_task_service
    environment:
      SERVER_PORT: 8083
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EMPLOYEE_SERVICE_URL: http://employee-service:8081
    ports:
      - "8083:8083"
    depends_on:
      zipkin:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - crm_network

  notification-service:
    build:
      context: ./backend/notification-service
    image: ${IMAGE_REGISTRY}/notification-service:${IMAGE_TAG}
    container_name: crm_notification_service
    environment:
      SERVER_PORT: 8084
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      zipkin:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - crm_network

  api-gateway:
    build:
      context: ./backend/api-gateway
    image: ${IMAGE_REGISTRY}/api-gateway:${IMAGE_TAG}
    container_name: crm_api_gateway
    environment:
      SERVER_PORT: 8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      EMPLOYEE_SERVICE_URL: http://employee-service:8081
      CLIENT_SERVICE_URL: http://client-service:8082
      TASK_SERVICE_URL: http://task-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports:
      - "8080:8080"
    depends_on:
      zipkin:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - crm_network

  loki:
    image: grafana/loki
    container_name: crm_loki
    ports:
      - "3100:3100"
    networks:
      - crm_network

  zipkin:
    image: openzipkin/zipkin
    container_name: crm_zipkin
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  prometheus:
    image: prom/prometheus
    container_name: crm_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

  grafana:
    image: grafana/grafana
    container_name: crm_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

networks:
  crm_network:
    driver: bridge
