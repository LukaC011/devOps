global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          application: "api-gateway"

  - job_name: "employee-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["employee-service:8081"]
        labels:
          application: "employee-service"

  - job_name: "client-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["client-service:8082"]
        labels:
          application: "client-service"

  - job_name: "task-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["task-service:8083"]
        labels:
          application: "task-service"

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8084"]
        labels:
          application: "notification-service"
